<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Procrastinations — Nate Berg</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        background: black;
        font-family: "Times New Roman", Times, serif;
    }

    body {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        padding: 20px;
        box-sizing: border-box;
    }

    img {
        display: block;
        opacity: 0.9;
        cursor: pointer;
        transition: transform 0.3s;
    }

    /* Lightbox */
    .lightbox {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.9);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
    }

    .lightbox.active {
        opacity: 1;
        pointer-events: all;
    }

    .lightbox img {
        max-width: 90vw;
        max-height: 90vh;
        transform: none;
        margin: 0;
    }
</style>
</head>

<body>

<script>
const images = [
    "1.jpeg","2.jpeg","3.jpeg","4.jpeg","5.jpeg",
    "6.jpeg","7.jpeg","8.jpeg","9.jpeg","10.jpeg",
    "11.jpeg","12.jpeg","13.jpeg","14.jpeg","15.jpeg",
    "16.jpeg","17.jpeg","18.jpeg","19.jpeg","20.jpeg"
];

// Shuffle helper
function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
}

// Create lightbox FIRST
const lightbox = document.createElement("div");
lightbox.className = "lightbox";

const lightboxImg = document.createElement("img");
lightbox.appendChild(lightboxImg);
document.body.appendChild(lightbox);

// Close lightbox when clicking backdrop
lightbox.addEventListener("click", (e) => {
    if (e.target === lightbox) {
        lightbox.classList.remove("active");
    }
});

// Size control: largest ≤ 2× area of smallest
const minWidth = 110;
const maxWidth = 155; // sqrt(2) ≈ 1.41 → area ≤ 2×
const sizes = images.map(() =>
    minWidth + Math.random() * (maxWidth - minWidth)
);

// Randomize order
shuffle(images);

// Render images
images.forEach((name, i) => {
    const img = document.createElement("img");
    img.src = "procrastinations/" + name;
    img.style.width = sizes[i] + "px";

    // Rotation: ±10°
    img.style.transform = `rotate(${(Math.random() - 0.5) * 20}deg)`;

    // Spacing: generous negative space
    const mx = 15 + Math.random() * 25;
    const my = 15 + Math.random() * 25;
    img.style.margin = `${my}px ${mx}px`;

    img.addEventListener("click", (e) => {
        e.stopPropagation();
        lightboxImg.src = img.src;
        lightbox.classList.add("active");
    });

    document.body.appendChild(img);
});
</script>

</body>
</html>
