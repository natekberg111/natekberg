<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Procrastinations — Nate Berg</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        background: black;
        font-family: "Times New Roman", Times, serif;
    }

    body {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-start;
        align-items: flex-start;
        padding: 20px;
        box-sizing: border-box;
    }

    img {
        max-width: 320px;
        opacity: 0.9;
        pointer-events: auto;
        margin: 10px;
        transition: transform 0.3s;
        display: block;
        cursor: pointer;
    }

    /* Lightbox overlay */
    .lightbox {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0,0,0,0.9);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
    }

    .lightbox.active {
        opacity: 1;
        pointer-events: all;
    }

    .lightbox img {
        max-width: 90%;
        max-height: 90%;
        transform: rotate(0deg);
        margin: 0;
    }
</style>
</head>

<body>

<script>
const images = [
    "1.jpeg","2.jpeg","3.jpeg","4.jpeg","5.jpeg",
    "6.jpeg","7.jpeg","8.jpeg","9.jpeg","10.jpeg","11.jpeg"
];

// Create grid images
images.forEach(name => {
    const img = document.createElement("img");
    img.src = "procrastinations/" + name;

    // random width for variation
    const size = 120 + Math.random() * 220;
    img.style.width = size + "px";

    // random slight rotation
    img.style.transform = `rotate(${(Math.random() - 0.5) * 15}deg)`;

    // random margin for negative space effect
    const marginX = 5 + Math.random() * 20;
    const marginY = 5 + Math.random() * 20;
    img.style.margin = `${marginY}px ${marginX}px`;

    document.body.appendChild(img);

    // click to open lightbox
    img.addEventListener("click", () => {
        lightboxImg.src = img.src;
        lightbox.classList.add("active");
    });
});

// Create lightbox overlay
const lightbox = document.createElement("div");
lightbox.classList.add("lightbox");
const lightboxImg = document.createElement("img");
lightbox.appendChild(lightboxImg);
document.body.appendChild(lightbox);

// click to close lightbox
lightbox.addEventListener("click", () => {
    lightbox.classList.remove("active");
});
</script>

</body>
</html>
