<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Procrastinations — Nate Berg</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: black;
    font-family: "Times New Roman", Times, serif;
}

body {
    display: flex;
    flex-wrap: wrap;
    justify-content: center; /* horizontal centering */
    align-items: flex-start;
    padding: 20px;
    box-sizing: border-box;
}

#instruction {
    width: 100%;
    text-align: center;
    color: white;
    font-size: 1.2rem;
    margin-bottom: 20px;
}

/* Image styles */
img {
    display: block;
    cursor: pointer;
    opacity: 0.9;
    transition: transform 0.3s, box-shadow 0.3s;
    border-radius: 4px;
}

/* Lightbox */
.lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
}

.lightbox.active {
    opacity: 1;
    pointer-events: all;
}

.lightbox img {
    max-width: 90vw;
    max-height: 90vh;
    transform: none;
    margin: 0;
}
</style>
</head>

<body>

<div id="instruction">Click to Enlarge</div>

<script>
const images = [
    "1.jpeg","2.jpeg","3.jpeg","4.jpeg","5.jpeg",
    "6.jpeg","7.jpeg","8.jpeg","9.jpeg","10.jpeg",
    "11.jpeg","12.jpeg","13.jpeg","14.jpeg","15.jpeg",
    "16.jpeg","17.jpeg","18.jpeg","19.jpeg","20.jpeg", "21.jpeg","22.jpeg"
];

// Shuffle helper
function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
}

// Random size generator (width 100–180px)
function randomSize() {
    return 100 + Math.random() * 80; 
}

// Random rotation ±15°
function randomRotation() {
    return (Math.random() - 0.5) * 30;
}

// Random margin ±30px
function randomMargin() {
    const mx = 10 + Math.random() * 20;
    const my = 10 + Math.random() * 20;
    return `${my}px ${mx}px`;
}

// Shuffle image order
shuffle(images);

// Create lightbox
const lightbox = document.createElement("div");
lightbox.className = "lightbox";
const lightboxImg = document.createElement("img");
lightbox.appendChild(lightboxImg);
document.body.appendChild(lightbox);

lightbox.addEventListener("click", (e) => {
    if (e.target === lightbox) lightbox.classList.remove("active");
});

// Render images
images.forEach(name => {
    const img = document.createElement("img");
    img.src = "procrastinations/" + name;

    const w = randomSize();
    img.style.width = w + "px";
    img.style.transform = `rotate(${randomRotation()}deg)`;
    img.style.margin = randomMargin();

    img.addEventListener("click", (e) => {
        e.stopPropagation();
        lightboxImg.src = img.src;
        lightbox.classList.add("active");
    });

    document.body.appendChild(img);
});
</script>

</body>
</html>
